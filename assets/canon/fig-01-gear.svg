<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4048"/>
      <stop offset="1" stop-color="#22262c"/>
    </linearGradient>
    <linearGradient id="gripG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b3037"/>
      <stop offset="1" stop-color="#3c424a"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#4b6b8a"/>
      <stop offset="0.45" stop-color="#1b2836"/>
      <stop offset="1" stop-color="#0a0e13"/>
    </radialGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a515a"/>
      <stop offset="0.18" stop-color="#2c3138"/>
      <stop offset="0.82" stop-color="#20242a"/>
      <stop offset="1" stop-color="#3d434b"/>
    </linearGradient>
    <pattern id="ribs" width="9" height="10" patternUnits="userSpaceOnUse">
      <rect width="9" height="10" fill="#262b31"/>
      <rect x="3" width="3" height="10" fill="#3a4048"/>
    </pattern>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#cf4b36"/>
    </marker>
  </defs>

  <rect width="1200" height="840" fill="#ffffff"/>

  <!-- ===== 左：机身正面 ===== -->
  <text x="60" y="70" font-size="26" font-weight="700" fill="#1b1f27">机身正面：先认这五个位置</text>
  <text x="60" y="104" font-size="17" fill="#7b8494">EOS R50 机身正面示意（按键位置以官方说明书为准）</text>

  <!-- 取景器凸起 -->
  <path d="M300 150 h150 a16 16 0 0 1 16 16 v44 h-182 v-44 a16 16 0 0 1 16 -16 z" fill="#2a2f36"/>
  <rect x="284" y="200" width="182" height="14" fill="#1b1f24"/>

  <!-- 机身 -->
  <rect x="150" y="208" width="470" height="330" rx="34" fill="url(#bodyG)"/>
  <!-- 手柄 -->
  <path d="M184 208 h96 v330 h-96 a34 34 0 0 1 -34 -34 v-262 a34 34 0 0 1 34 -34 z" fill="url(#gripG)"/>
  <g opacity="0.5">
    <circle cx="232" cy="286" r="2.6" fill="#15181c"/><circle cx="232" cy="306" r="2.6" fill="#15181c"/>
    <circle cx="232" cy="326" r="2.6" fill="#15181c"/><circle cx="232" cy="346" r="2.6" fill="#15181c"/>
    <circle cx="232" cy="366" r="2.6" fill="#15181c"/><circle cx="232" cy="386" r="2.6" fill="#15181c"/>
    <circle cx="232" cy="406" r="2.6" fill="#15181c"/><circle cx="232" cy="426" r="2.6" fill="#15181c"/>
    <circle cx="232" cy="446" r="2.6" fill="#15181c"/><circle cx="232" cy="466" r="2.6" fill="#15181c"/>
  </g>

  <!-- 镜头 -->
  <circle cx="470" cy="373" r="166" fill="#171b20"/>
  <circle cx="470" cy="373" r="152" fill="#2c3238"/>
  <circle cx="470" cy="373" r="136" fill="url(#glass)"/>
  <ellipse cx="415" cy="318" rx="46" ry="30" fill="#8fb4d4" opacity="0.22" transform="rotate(-30 415 318)"/>
  <circle cx="470" cy="373" r="136" fill="none" stroke="#0b0e12" stroke-width="5"/>
  <circle cx="470" cy="373" r="152" fill="none" stroke="#14181d" stroke-width="3"/>
  <text x="470" y="378" font-size="15" fill="#c9d3de" text-anchor="middle" opacity="0.85">50mm 1:1.8</text>

  <!-- ① 模式转盘 -->
  <circle cx="596" cy="196" r="40" fill="#31363d" stroke="#4d545c" stroke-width="3"/>
  <circle cx="596" cy="196" r="26" fill="#3a4048"/>
  <text x="596" y="202" font-size="14" fill="#c8d0d9" text-anchor="middle">M</text>

  <!-- ② 快门 + 主拨盘 -->
  <rect x="500" y="176" width="80" height="26" rx="13" fill="#454c55"/>
  <rect x="512" y="168" width="56" height="16" rx="8" fill="#9aa3ad"/>

  <!-- ③ 热靴/内置闪 -->
  <rect x="330" y="116" width="90" height="18" rx="4" fill="#3a4048"/>
  <rect x="344" y="104" width="62" height="14" rx="3" fill="#4a515a"/>

  <!-- ④ 对焦辅助灯 -->
  <circle cx="248" cy="238" r="11" fill="#5c6672"/>
  <circle cx="248" cy="238" r="5" fill="#d8b26a"/>

  <!-- ⑤ 镜头释放键 -->
  <rect x="634" y="316" width="26" height="58" rx="10" fill="#4a515a"/>

  <!-- 编号圆点 -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <circle cx="596" cy="118" r="15" fill="#cf4b36"/><text x="596" y="124" fill="#fff">1</text>
    <circle cx="470" cy="140" r="15" fill="#cf4b36"/><text x="470" y="146" fill="#fff">2</text>
    <circle cx="250" cy="142" r="15" fill="#cf4b36"/><text x="250" y="148" fill="#fff">3</text>
    <circle cx="212" cy="204" r="15" fill="#cf4b36"/><text x="212" y="210" fill="#fff">4</text>
    <circle cx="700" cy="290" r="15" fill="#cf4b36"/><text x="700" y="296" fill="#fff">5</text>
  </g>
  <path d="M596 133 V156" stroke="#cf4b36" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M470 155 V180" stroke="#cf4b36" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M264 145 L340 118" stroke="#cf4b36" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M212 219 L240 234" stroke="#cf4b36" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M700 290 L662 322" stroke="#cf4b36" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- ===== 右：镜头侧面 ===== -->
  <text x="716" y="70" font-size="26" font-weight="700" fill="#1b1f27">镜头侧面：那个环和拨杆</text>
  <text x="716" y="104" font-size="17" fill="#7b8494">RF50mm F1.8 STM 镜身结构示意</text>

  <!-- 卡口端 -->
  <rect x="716" y="286" width="34" height="176" rx="8" fill="#3b4149"/>
  <rect x="750" y="270" width="52" height="208" rx="6" fill="url(#barrel)"/>
  <!-- 对焦环 -->
  <rect x="802" y="262" width="196" height="224" rx="10" fill="url(#ribs)"/>
  <rect x="802" y="262" width="196" height="224" rx="10" fill="none" stroke="#15191e" stroke-width="3"/>
  <!-- 前段 -->
  <rect x="998" y="278" width="86" height="192" rx="8" fill="url(#barrel)"/>
  <rect x="1084" y="292" width="26" height="164" rx="6" fill="#1c2126"/>
  <ellipse cx="1110" cy="374" rx="14" ry="82" fill="#0d1116"/>

  <!-- 拨杆 -->
  <rect x="884" y="212" width="120" height="36" rx="18" fill="#1d2126" stroke="#525a64" stroke-width="3"/>
  <rect x="888" y="216" width="56" height="28" rx="14" fill="#8d97a3"/>

  <g font-size="15" font-weight="700" text-anchor="middle">
    <circle cx="900" cy="540" r="15" fill="#cf4b36"/><text x="900" y="546" fill="#fff">6</text>
    <circle cx="944" cy="182" r="15" fill="#cf4b36"/><text x="944" y="188" fill="#fff">7</text>
    <circle cx="748" cy="548" r="15" fill="#cf4b36"/><text x="748" y="554" fill="#fff">8</text>
  </g>
  <path d="M900 525 V496" stroke="#cf4b36" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M944 197 V208" stroke="#cf4b36" stroke-width="2"/>
  <path d="M748 533 L748 470" stroke="#cf4b36" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- ===== 图例 ===== -->
  <line x1="60" y1="640" x2="1140" y2="640" stroke="#e3e7ee" stroke-width="2"/>
  <g font-size="17" fill="#3a4250">
    <text x="60" y="688"><tspan font-weight="700" fill="#cf4b36">1</tspan>　模式转盘：日常就停在 Av，需要抓拍再切 Tv</text>
    <text x="60" y="724"><tspan font-weight="700" fill="#cf4b36">2</tspan>　快门按钮 + 主拨盘：食指搭上去，拨盘控制快门或光圈</text>
    <text x="60" y="760"><tspan font-weight="700" fill="#cf4b36">3</tspan>　热靴 / 内置闪光灯：室内应急补光，记得手动压曝光</text>
    <text x="620" y="688"><tspan font-weight="700" fill="#cf4b36">4</tspan>　对焦辅助灯：暗处会亮，别用手指挡住</text>
    <text x="620" y="724"><tspan font-weight="700" fill="#cf4b36">5</tspan>　镜头释放按钮：换镜头必须按住</text>
    <text x="620" y="760"><tspan font-weight="700" fill="#cf4b36">6</tspan>　带纹理的环：FOCUS 档是手动对焦，CONTROL 档是第三个拨盘</text>
    <text x="60" y="806"><tspan font-weight="700" fill="#cf4b36">7</tspan>　FOCUS / CONTROL 拨杆　　</text>
    <text x="360" y="806"><tspan font-weight="700" fill="#cf4b36">8</tspan>　RF 卡口：有电子触点，别用副厂转接环凑合</text>
  </g>
</svg>
