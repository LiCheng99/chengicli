<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="A轴角度累计与取模">
  <rect width="900" height="400" fill="#f7f8fa"/>
  <text x="40" y="52" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="23" font-weight="700" fill="#1f2937">角度累加，是“多转一圈”的另一个来源</text>
  <text x="40" y="84" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" fill="#4b5563">连续多个操作里 A 值一直往上加，没有对 360 取模，机床就按绝对值一路转下去。</text>

  <!-- 错误行 -->
  <text x="40" y="140" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" font-weight="700" fill="#ea580c">错误：累计输出</text>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="700">
    <rect x="40" y="156" width="120" height="52" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="100" y="189" text-anchor="middle" fill="#1f2937">A0</text>
    <path d="M 172 182 L 206 182" stroke="#ea580c" stroke-width="3" marker-end="url(#ar1)"/>
    <rect x="212" y="156" width="120" height="52" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="272" y="189" text-anchor="middle" fill="#1f2937">A350</text>
    <path d="M 344 182 L 378 182" stroke="#ea580c" stroke-width="3" marker-end="url(#ar1)"/>
    <rect x="384" y="156" width="120" height="52" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="444" y="189" text-anchor="middle" fill="#1f2937">A710</text>
  </g>
  <text x="522" y="189" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" fill="#9a3412">每换一个操作就多绕一圈</text>

  <!-- 正确行 -->
  <text x="40" y="272" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" font-weight="700" fill="#2563eb">正确：取模后的等价值</text>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="700">
    <rect x="40" y="288" width="120" height="52" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="100" y="321" text-anchor="middle" fill="#1f2937">A0</text>
    <path d="M 172 314 L 206 314" stroke="#2563eb" stroke-width="3" marker-end="url(#ar2)"/>
    <rect x="212" y="288" width="120" height="52" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="272" y="321" text-anchor="middle" fill="#1f2937">A-10</text>
    <path d="M 344 314 L 378 314" stroke="#2563eb" stroke-width="3" marker-end="url(#ar2)"/>
    <rect x="384" y="288" width="120" height="52" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="444" y="321" text-anchor="middle" fill="#1f2937">A-20</text>
  </g>
  <text x="522" y="321" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" fill="#1e40af">落在 -180~180 内，转角最小</text>

  <!-- 公式框 -->
  <g transform="translate(40,352)">
    <text x="0" y="18" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#374151">A_out = ((A_raw + 180) mod 360) - 180</text>
  </g>

  <defs>
    <marker id="ar1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ea580c"/>
    </marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
