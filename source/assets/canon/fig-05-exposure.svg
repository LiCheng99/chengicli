<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>

  <text x="60" y="62" font-size="26" font-weight="700" fill="#1b1f27">三个参数，在 R50 上分别由谁管</text>
  <text x="60" y="96" font-size="17" fill="#7b8494">搞清这张图，Av 档就不会再手忙脚乱</text>

  <!-- 三角 -->
  <polygon points="330,170 210,430 450,430" fill="#fbf4f1" stroke="#cf4b36" stroke-width="3" stroke-linejoin="round"/>
  <text x="330" y="330" font-size="19" font-weight="700" fill="#1b1f27" text-anchor="middle">曝光</text>
  <text x="330" y="356" font-size="14" fill="#7b8494" text-anchor="middle">动一个，另一个跟着补</text>

  <circle cx="330" cy="170" r="46" fill="#ffffff" stroke="#cf4b36" stroke-width="3"/>
  <text x="330" y="166" font-size="18" font-weight="700" fill="#cf4b36" text-anchor="middle">光圈</text>
  <text x="330" y="188" font-size="13" fill="#7b8494" text-anchor="middle">f/1.8 – f/16</text>

  <circle cx="210" cy="430" r="46" fill="#ffffff" stroke="#3b6ea5" stroke-width="3"/>
  <text x="210" y="426" font-size="18" font-weight="700" fill="#3b6ea5" text-anchor="middle">快门</text>
  <text x="210" y="448" font-size="13" fill="#7b8494" text-anchor="middle">1/4000 – 30″</text>

  <circle cx="450" cy="430" r="46" fill="#ffffff" stroke="#6b7480" stroke-width="3"/>
  <text x="450" y="426" font-size="18" font-weight="700" fill="#4a525e" text-anchor="middle">ISO</text>
  <text x="450" y="448" font-size="13" fill="#7b8494" text-anchor="middle">100 – 25600</text>

  <text x="252" y="270" font-size="14" fill="#8b95a3" transform="rotate(-60 252 270)">管虚化</text>
  <text x="412" y="270" font-size="14" fill="#8b95a3" transform="rotate(60 412 270)">管噪点</text>
  <text x="330" y="472" font-size="14" fill="#8b95a3" text-anchor="middle">管运动</text>

  <!-- 三个入口卡片 -->
  <g>
    <rect x="620" y="140" width="530" height="112" rx="14" fill="#fdf6f3" stroke="#f0d3c9" stroke-width="2"/>
    <text x="648" y="180" font-size="18" font-weight="700" fill="#cf4b36">光圈 → 镜头上的 CONTROL 环</text>
    <text x="648" y="212" font-size="15" fill="#4a525e">拨杆切到 CONTROL，拇指转环，光圈以 1/3 档跳。</text>
    <text x="648" y="236" font-size="15" fill="#8b95a3">Av 档下这是你唯一要动的旋钮。</text>

    <rect x="620" y="272" width="530" height="112" rx="14" fill="#f3f7fb" stroke="#cfdcea" stroke-width="2"/>
    <text x="648" y="312" font-size="18" font-weight="700" fill="#3b6ea5">快门 → 机顶主拨盘</text>
    <text x="648" y="344" font-size="15" fill="#4a525e">食指搭在快门键上，前后拨那个盘，快门速度在屏幕左下跳。</text>
    <text x="648" y="368" font-size="15" fill="#8b95a3">Av 档下它控制的是“最低快门”兜底值。</text>

    <rect x="620" y="404" width="530" height="112" rx="14" fill="#f6f7f9" stroke="#dde2ea" stroke-width="2"/>
    <text x="648" y="444" font-size="18" font-weight="700" fill="#4a525e">ISO → 交给 AUTO</text>
    <text x="648" y="476" font-size="15" fill="#4a525e">别手动拧。设 AUTO，再把“最低快门速度”定在 1/125。</text>
    <text x="648" y="500" font-size="15" fill="#8b95a3">镜头太暗时它会自己拉高 ISO，而不是给你一张糊片。</text>
  </g>

  <line x1="60" y1="556" x2="1150" y2="556" stroke="#e3e7ee" stroke-width="2"/>
  <text x="60" y="592" font-size="17" fill="#3a4250">新手最容易犯的错：三个都想管，结果全在动。</text>
  <text x="60" y="624" font-size="17" fill="#6b7480">顺序固定下来——先定光圈（要多虚），再让快门自己找（够不够 1/125），最后 ISO 兜底。</text>
</svg>
